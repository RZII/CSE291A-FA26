[project]
name = "edge-agent-serving"
version = "0.1.0"
description = "CSE 291A Option 1: memory-aware agent edge serving"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "rank-bm25>=0.2.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
analysis = [
    "matplotlib>=3.10",
]
build = [
    "pyarrow>=26.0.0",
]
dev = [
    "pytest>=9.1.1",
]
